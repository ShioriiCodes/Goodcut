<head>

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.3/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/Assets/css/font.css" />

      <!-- Favicon Icon -->
      <link rel="icon" type="image/png" href="/Assets/Logo/logow.png" sizes="16x16" />
      <link rel="apple-touch-icon" sizes="180x180" href="/Assets/Logo/logow.png">
      <link rel="icon" type="image/png" sizes="32x32" href="/Assets/Logo/logow.png">

<body class="overflow-x-hidden">

  <!-- Fullscreen Wrapper -->
  <section class="h-screen flex flex-col bg-black text-white font-workSans">
      <!-- Header -->
    <header class="bg-black text-white px-6 md:px-[40px] py-10 mr-[-40px] flex justify-between items-center uppercase tracking-widest">
      <!-- Logo -->
      <div class="flex items-center gap-2 ml-2">
        <a href="/index.html">
          <img src="/Assets/Logo/logow.png" alt="GoodCut Studio Logo" class="h-auto w-[130px]" />
        </a>
      </div>

      <!-- Navigation -->
      <nav class="hidden md:flex items-center leading-none px-6 md:px-16 py-4 gap-16">
        <a href="/index2.html" class="nav-link text-2xl font-built_titling font-semibold hover:underline underline-offset-8 hover:decoration-4 hover:decoration-[#b4e205] transition">Home</a>
        <a href="/about.html" class="nav-link text-2xl font-built_titling font-semibold hover:underline underline-offset-8 hover:decoration-4 hover:decoration-[#b4e205] transition">About</a>
        <a href="/work.html" class="nav-link text-2xl font-built_titling font-semibold hover:underline underline-offset-8 hover:decoration-4 hover:decoration-[#b4e205] transition">Works</a>
        <a href="/service.html" class="nav-link text-2xl font-built_titling font-semibold hover:underline underline-offset-8 hover:decoration-4 hover:decoration-[#b4e205] transition">Services</a>
        <!-- Button (Let's Cut) -->
        <button onclick="openModal()" class="flex items-center gap-2 border-2 border-white px-7 py-1 rounded-full hover:border-[#b4e205] hover:text-[#b4e205] transition leading-none group font-built_titling font-semibold text-2xl tracking-wider">
          <span class="px-2 mx-auto">Let’s Cut</span>
          <img src="/Assets/Image/arrow3.png" alt="Arrow" class="h-[36px] w-auto group-hover:hidden mr-[-23px]"/>
          <img src="/Assets/Image/arrow2.png" alt="Arrow Hover" class="h-[36px] w-auto hidden group-hover:inline mr-[-23px]"/>
        </button>
      </nav>
    </header>

    <!-- Contact Modal -->
    <div id="contactModal" class="fixed inset-0 z-50 bg-black bg-opacity-80 backdrop-blur-sm flex items-center justify-center hidden fade-in-start">
      <div class="relative max-w-[1400px] w-full mx-auto border border-white/40 text-white bg-black/40 px-7 py-[100px]">
        
        <!-- Close Button -->
        <button class="absolute top-0 left-3 font-Bebas_Neue text-white text-6xl hover:text-[#b4e205]" onclick="closeModal()">×</button>
        
        <!-- Header: Contact Info & Tagline -->
        <div class="flex justify-between items-start flex-wrap mb-12 pl-12 mt-[-50px]">
          <div>
            <h2 class="text-[#b4e205] text-[50px] font-built_titling font-extrabold mb-1">CONTACT US</h2>
            <p class="text-2xl font-workSans">contact@goodcut.com</p>
          </div>
          <div class="text-right">
            <h3 class="text-4xl font-workSans">Let’s create together.</h3>
            <p class="text-2xl text-white/70 font-workSans font-normal">Let us know how we can help.</p>
          </div>
        </div>

        <!-- Centered Form -->
        <div class="flex justify-center">
          <form class="w-full max-w-[700px] space-y-5 text-white text-left">
            <!-- Name -->
            <div>
              <label class="block text-[25px] font-Bebas_Neue font-normal mb-1 uppercase">Name*</label>
              <input type="text" placeholder="Your Name" class="w-full px-4 py-4 border border-white/20 bg-transparent placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-[#b4e205] placeholder:text-[20px] font-bebas_neue" />
            </div>
            <!-- Email -->
            <div>
              <label class="block text-[25px] font-Bebas_Neue font-normal mb-1 uppercase">Email*</label>
              <input type="email" placeholder="Your email address" class="w-full px-4 py-4 border border-white/20 bg-transparent placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-[#b4e205] placeholder:text-[20px]" />
            </div>
            <!-- Message -->
            <div>
              <label class="block text-[25px] font-Bebas_Neue font-normal mb-1 uppercase">Your Message*</label>
              <textarea rows="4" placeholder="Your message" class="w-full px-4 py-2 pb-16 border border-white/20 bg-transparent placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-[#b4e205] placeholder:text-[20px]"></textarea>
            </div>
            <!-- Submit Button -->
            <button type="submit" class="text-2xl mt-10 flex items-center gap-4 px-7 py-2 bg-white text-black uppercase font-Bebas_Neue font-normal rounded-full hover:bg-[#b4e205] hover:text-black transition duration-300 leading-none group tracking-wider shadow-none border-none">
              <span class="px-2 mx-auto">Send Message</span>
              <img src="/Assets/svg/arrow.svg" alt="Arrow" class="h-12 w-auto group-hover:hidden mr-[-20px]" />
              <img src="/Assets/svg/arrow.svg" alt="Arrow Hover" class="h-12 w-auto hidden group-hover:inline mr-[-20px]" />
            </button>
          </form>
        </div>
      </div>
    </div>
 
    <div class="w-full flex flex-col justify-center items-center mt-[150px] relative">

     <a href="/work.html?category=NFT%20COLLECTION" class="absolute z-20 flex items-center gap-2 px-5 py-2 mb-[-400px] bg-black/70 border border-white/30 rounded-full text-white font-built_titling text-xl hover:bg-[#b4e205] hover:text-black transition shadow-lg">
        <i class="fas fa-arrow-left"></i>
        <span>Back to NFT Collection</span>
      </a>
      <div class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
        <span class="text-white text-5xl md:text-7xl font-built_titling font-bold drop-shadow-lg text-center mb-[-250px]">
          Welcome to Hungry Universe
        </span>
      </div>
    </div>
  </section>

    <section class="w-full bg-black text-white">

        <!-- Description -->
        <div class="h-[30vh] bg-black mx-auto px-4 text-white text-lg leading-relaxed text-center flex flex-col items-center">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-x-5 gap-y-4 items-center px-2 pb-10 fade-in-start">
            <div>
              <a href="https://www.stargaze.zone/m/z-creatures/tokens" target="_blank" rel="noopener">
                <img src="/Assets/Logo/Z-CREATUREsad.png" alt="Hungry Guy Logo" class="mx-auto h-20 w-auto" />
              </a>
            </div>
            <div>
              <a href="#" target="_blank" rel="noopener">
                <img src="/Assets/Logo/Esoj.png" alt="Logo 2" class="mx-auto h-20 w-auto" />
              </a>
            </div>
            <div>
              <a href="https://www.anyo-nft.com/" target="_blank" rel="noopener">
                <img src="/Assets/Logo/Anyo.png" alt="Logo 3" class="mx-auto h-20 w-auto" />
              </a>
            </div>
            <div>
              <a href="https://www.stargaze.zone/" target="_blank" rel="noopener">
                <img src="/Assets/Logo/Stargaze.png" alt="Logo 4" class="mx-auto h-20 w-auto" />
              </a>
            </div>
          </div>
          <div class="flex justify-between items-center max-w-[1400px] mx-auto fade-in-start">
            <div class="text-[18px] text-white font-workSans font-light">&copy;2025 ANYO. All Rights Reserved.</div>
          </div>
            <div onclick="scrollToTop()" class="mx-auto mt-12 mb-[-50px] text-[#a1a1a1] font-workSans w-auto px-5 h-[50px] rounded-full flex items-center justify-center text-[20px] transition-colors duration-300 cursor-pointer font-built_titling font-normal gap-3 fade-in-start"
              style="min-width: 140px; max-width: 320px;">
              <span class="text-[20px] font-semibold font-built_titling leading-none mb-[-85px]">↑</span>
              <span class="text-[20px] font-semibold tracking-wide mt-[6px] mb-[-85px]">Back to Top</span>
            </div>
          </div>
            <div class="w-full max-w-[1400px] border-t border-[#333] mx-auto pb-5"></div>
      </section>

  <!-- Footer Section -->

      <div class="flex items-center pt-2">
        <img src="/Assets/Logo/GOODCUT_1.png" alt="GoodCut Studio Logo" class="h-[30px] w-auto" />
        <span class="text-[29px] font-semibold font-built_titling ml-2">GOODCUT STUDIO</span>

        Quezon | Puerto Princesa, Palawan Philippines

    <div class="flex justify-between items-center max-w-[1400px] mx-auto">
      <div class="py-2 text-[20px] text-white/80 font-workSans font-semibold">&copy;2025</div>
      <div>
